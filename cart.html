<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng | COFFEEHOUSE</title>
<meta name="description" content="Giỏ hàng của bạn tại COFFEEHOUSE.">
<link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="cart">
<div id="site-header"></div>
<section class="page-hero"><div class="container"><h1>Giỏ hàng</h1><p class="crumb"><a href="index.html">Trang chủ</a> / Giỏ hàng</p></div></section>
<main>

<section class="section"><div class="container">
<div id="cartEmpty" class="empty hidden"><i class="fa-solid fa-bag-shopping"></i><h3>Giỏ hàng đang trống</h3><p>Hãy chọn vài món yêu thích để bắt đầu.</p><a class="btn" href="shop.html">Tiếp tục mua sắm</a></div>
<div id="cartFull" class="cart-layout">
  <div><table class="cart-table"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr></thead><tbody id="cartBody"></tbody></table>
    <div class="cart-actions"><a class="btn btn-ghost" href="shop.html"><i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm</a><button class="btn btn-ghost" id="clearCart" type="button"><i class="fa-solid fa-trash-can"></i> Xóa toàn bộ giỏ hàng</button></div></div>
  <aside class="summary"><h3>Tổng đơn hàng</h3>
    <form class="coupon" id="couponForm"><input id="couponInput" placeholder="Mã giảm giá" aria-label="Mã giảm giá"><button class="btn btn-sm" type="submit">Áp dụng</button></form>
    <p class="coupon-hint" id="couponMsg"></p>
    <div class="sum-row"><span>Tạm tính</span><span id="sumSub"></span></div>
    <div class="sum-row"><span>Giảm giá</span><span id="sumDiscount"></span></div>
    <div class="sum-row"><span>Phí vận chuyển</span><span id="sumShip"></span></div>
    <div class="sum-row total"><span>Tổng cộng</span><span id="sumTotal"></span></div>
    <a class="btn btn-block" href="checkout.html" style="margin-top:14px">Tiến hành thanh toán</a></aside>
</div></div></section>
</main>
<div id="site-footer"></div>
<div id="toast-wrap" aria-live="polite"></div>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/cart.js"></script>
</body>
</html>
