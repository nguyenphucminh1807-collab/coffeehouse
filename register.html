<body data-page="register">
<div id="site-header"></div>
<section class="page-hero"><div class="container"><h1>Đăng ký</h1><p class="crumb"><a href="index.html">Trang chủ</a> / Đăng ký</p></div></section>
<main>

<section class="section alt"><div class="container auth-wrap"><form class="form-card" id="registerForm" novalidate><h2>Tạo tài khoản</h2><div id="regMsg"></div>
  <div class="field"><label for="regName">Họ tên</label><input id="regName" type="text" placeholder="" ><small class="err"></small></div><div class="field"><label for="regEmail">Email</label><input id="regEmail" type="email" placeholder="" ><small class="err"></small></div><div class="field"><label for="regPhone">Số điện thoại</label><input id="regPhone" type="tel" placeholder="" ><small class="err"></small></div>
  <div class="field"><label for="regPw">Mật khẩu</label><input id="regPw" type="password" placeholder="Ít nhất 6 ký tự, gồm chữ và số" ><small class="err"></small></div><div class="field"><label for="regPw2">Xác nhận mật khẩu</label><input id="regPw2" type="password" placeholder="" ><small class="err"></small></div>
  <button class="btn btn-block" type="submit">Đăng ký</button>
  <p style="text-align:center;margin:18px 0 0">Đã có tài khoản? <a href="login.html" style="color:var(--caramel);font-weight:600">Đăng nhập</a></p></form></div></section>
</main>
